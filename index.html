<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f0b" />
  <title>Toxos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/threejs.css" />
</head>
<body>

  <!-- Preloader -->
  <div class="preloader">
    <div class="preloader-wrapper">
      <div class="preloader-content">
        <div class="preloader-brand">TOXOS</div>
        <div class="preloader-bar-track">
          <div class="preloader-bar-fill" id="preloader-bar"></div>
        </div>
        <p class="preloader-text" id="preloader-text">Initialising…</p>
      </div>
    </div>
  </div>

  <!-- Three.js canvas container -->
  <div id="viewer-container"></div>

  <!-- Header -->
  <header id="header">
      <span class="brand-mark">TOXOS</span>
      <button id="dark-mode-btn" class="dark-mode-btn" aria-label="Toggle dark mode">◑</button>
  </header>

  <!-- Legend overlay -->
  <div id="legend">
    <div class="legend-item">
      <span class="legend-dot cso"></span>
      <span class="legend-label">Combined Sewer Overflow (CSO) &nbsp;</span>
      <span class="legend-count" id="count-cso">—</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot npdes"></span>
      <span class="legend-label">Water National Pollutant Discharge Elimination Systems (NPDES) &nbsp;</span>
      <span class="legend-count" id="count-npdes">—</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot rcra"></span>
      <span class="legend-label">Regulated Hazardous Waste Management Facilities (RCRA) &nbsp;</span>
      <span class="legend-count" id="count-rcra">—</span>
    </div>
  </div>

  <!-- Tooltip for hover info -->
  <div id="tooltip" class="hidden"></div>

  <!-- Detail panel – right-side card, slides in on data-point click -->
  <div id="detail-panel" class="detail-panel hidden" aria-hidden="true">
    <div class="dp-header">
      <div class="dp-nav">
        <button id="detail-prev" class="dp-nav-btn" aria-label="Previous point">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M10 3L6 8l4 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <span id="dp-counter" class="dp-counter"></span>
        <button id="detail-next" class="dp-nav-btn" aria-label="Next point">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3l4 5-4 5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
      <button id="detail-close" class="dp-close-btn" aria-label="Close panel">
        <svg width="12" height="12" viewBox="0 0 14 14" fill="none" aria-hidden="true">
          <path d="M1 1l12 12M13 1L1 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="dp-scroll">
      <div id="dp-type-badge" class="dp-type-badge"></div>
      <h2 id="detail-title" class="detail-title"></h2>
      <div id="detail-meta" class="detail-meta"></div>
      <div id="dp-image-wrap" class="dp-image-wrap"></div>
      <p id="detail-body" class="detail-body"></p>
    </div>
  </div>

  <!-- Footer -->
  <footer id="footer">
    <div class="footer-controls">
      <p class="controls-mouse">
        <span class="key">LMB</span> Rotate&ensp;
        <span class="key">RMB</span> Pan&ensp;
        <span class="key">Scroll</span> Zoom&ensp;
        <span class="key">DblClick</span> Top View
      </p>
    </div>
    <div class="footer-meta">
      <span>EPSG:2263 · NY State Plane</span>
    </div>
  </footer>

  <!-- Entry point -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
