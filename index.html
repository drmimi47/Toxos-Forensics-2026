<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0b0f0b" />
  <title>Toxos</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="./favicon-16x16.png">
  <link rel="manifest" href="./site.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="./css/threejs.css" />
</head>
<body>

  <!-- Preloader -->
  <div class="preloader">
    <div class="preloader-wrapper">
      <div class="preloader-content">
        <div class="preloader-brand">TOXOS</div>
        <div class="preloader-bar-track">
          <div class="preloader-bar-fill" id="preloader-bar"></div>
        </div>
        <p class="preloader-text" id="preloader-text">Initialising…</p>
      </div>
    </div>
  </div>

  <!-- Three.js canvas container -->
  <div id="viewer-container"></div>

  <!-- Header -->
  <header id="header">
      <span class="brand-mark">TOXOS<span class="brand-sub">lab</span></span>
      <button id="dark-mode-btn" class="dark-mode-btn" aria-label="Toggle dark mode">◑</button>
  </header>

  <!-- Legend overlay -->
  <div id="legend">
    <div class="legend-item">
      <span class="legend-dot cso"></span>
      <span class="legend-label">Combined Sewer Overflow (CSO) &nbsp;</span>
      <span class="legend-count" id="count-cso">—</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot npdes"></span>
      <span class="legend-label">Water National Pollutant Discharge Elimination Systems (NPDES) &nbsp;</span>
      <span class="legend-count" id="count-npdes">—</span>
    </div>
    <div class="legend-item">
      <span class="legend-dot rcra"></span>
      <span class="legend-label">Regulated Hazardous Waste Management Facilities (RCRA) &nbsp;</span>
      <span class="legend-count" id="count-rcra">—</span>
    </div>
  </div>

  <!-- Tooltip for hover info -->
  <div id="tooltip" class="hidden"></div>

  <!-- Detail panels are created dynamically by detailPanel.js -->

  <!-- Footer -->
  <footer id="footer">
    <div class="footer-controls">
      <p class="controls-mouse">
        <span class="key">LMB</span> Rotate&ensp;
        <span class="key">RMB</span> Pan&ensp;
        <span class="key">Scroll</span> Zoom&ensp;
        <span class="key">DblClick</span> Top View&ensp;
        <span class="key">ESC</span> Close Panels
      </p>
    </div>
    <div class="footer-meta">
      <span id="last-updated">Last Updated —</span>
    </div>
  </footer>

  <!-- Last commit date -->
  <script>
    fetch('./lastUpdated.json').then(r => r.json()).then(({ date }) => {
      const d   = new Date(date);
      const mon = d.toLocaleString('en-US', { month: 'long' });
      const day = d.getDate();
      const hh  = String(d.getHours()).padStart(2, '0');
      const mm  = String(d.getMinutes()).padStart(2, '0');
      const el  = document.getElementById('last-updated');
      if (el) el.textContent = `Last Updated ${mon}-${day}-${hh}:${mm}`;
    }).catch(() => {});
  </script>

  <!-- Entry point -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
